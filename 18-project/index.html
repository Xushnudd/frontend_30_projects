<!DOCTYPE html>

<head>

    <title>Svg</title>
</head>
<body>

        <circle cx="50" cy="50" r="50" fill="blue" />

    <svg width="100" height="100">
        <polygon points="50,0 90,100 10,100" fill="blueviolet" stroke="blue" stroke-width="1" />
    </svg>
    <svg width="100" height="100">
        <path d="M0 0 L0 100 L10 100 L10 0 L20 0 L20 100 L30 100 L30 0 L40 0 L40 100 L50 100 L50 0 L60 0 L60 100 L70 100 L70 0 L80 0 L80 100 L90 100 L90 0 L100 0 L100 100 Z L100 0 L0 100 L100 100" stroke="black" fill="none" />

</html>
