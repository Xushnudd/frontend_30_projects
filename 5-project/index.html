<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(34, 22, 209);
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transform: perspective(500px) rotateX(60deg);
        }

        .loading .div {
            position: absolute;
            border: 5px solid white;
            box-shadow: 0 5px 0 #ccc, inset 0 5px 0 #ccc;
            box-sizing: border-box;
            border-radius: 50%;
            animation: ani 3s ease-in-out infinite;
        }

        @keyframes ani {

            0%,
            100% {
                transform: rotateY(360deg);
            }

            50% {
                transform: rotateY(180deg);
            }
        }
    </style>
</head>

<body>
    <div class="loading">
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
        <div class="div"></div>
    </div>
    <script>
        document.querySelectorAll(".div").forEach((el, i) => {
            el.style.inset = `${i * 10}px`
            el.style.animationDelay = `${1.5 - i * 0.1}s`
        })
    </script>
</body>

</html>
