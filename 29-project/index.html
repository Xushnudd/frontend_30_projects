<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 150px repeat(2, 300px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
        }
        .box1 {
            background-color: aqua;
            text-align: center;
            grid-column: span 3;
        }
        .box2 {
            background-color: blue;
            grid-row: span 2;
        }
        .box3 {
            background-color: red;
            grid-column: 2/4;
        }
        .box4 {
            background-color: green;
        }
        .box5 {
            background-color: pink;
        }
        .box6 {
            background-color: yellow;
            grid-column: span 3;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="box1">Header</div>
        <div class="box2">side bar</div>
        <div class="box3">content1</div>
        <div class="box4">content2</div>
        <div class="box5">content</div>
        <div class="box6">footer</div>
    </div>
</body>
</html>
